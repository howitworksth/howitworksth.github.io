:root{--yellow:#FFD23F;--blue:#2457FF;--ink:#111;--card:#fff;--muted:#4a4a4a;--shopee:#C9381A}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Kanit,system-ui,sans-serif;background:var(--yellow);color:var(--ink);line-height:1.5;min-height:100vh;
  background-image:radial-gradient(rgba(17,17,17,.08) 1.5px,transparent 1.5px);background-size:18px 18px}
main{width:min(100% - 32px,1180px);margin:0 auto;padding:clamp(20px,4vw,48px) 0 40px}
header{text-align:center;margin-bottom:clamp(16px,3vw,28px)}
.avatar{width:clamp(80px,12vw,112px);height:auto;aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);background:var(--yellow);box-shadow:4px 4px 0 var(--ink)}
h1{font-size:clamp(1.35rem,2.6vw,2rem);font-weight:800;line-height:1.25;margin-top:10px}
h1 small{display:block;font-size:.72em;font-weight:600}
.tagline{font-size:clamp(.95rem,1.4vw,1.1rem)}
.social{display:flex;justify-content:center;gap:10px;margin-top:12px;list-style:none;padding:0}
.social a{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--ink);color:#fff;transition:transform .15s}
.social a:hover{transform:translateY(-2px)}
.social svg{width:22px;height:22px;fill:currentColor}

.search{position:relative;max-width:520px;margin:0 auto 14px}
.search svg{position:absolute;left:16px;top:50%;translate:0 -50%;width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;pointer-events:none}
.search input{width:100%;min-height:52px;padding:0 16px 0 46px;font:inherit;font-size:1rem;color:var(--ink);background:#fff;
  border:2.5px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);appearance:none}
.search input::placeholder{color:#6b6b6b}
.search input:focus{outline:3px solid var(--blue);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{text-align:center;font-size:.95rem;font-weight:600;margin-bottom:14px}

#list{display:grid;gap:clamp(14px,2vw,22px);list-style:none;padding:0;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),350px));justify-content:center;align-items:start}
#list li{display:flex;flex-direction:column;gap:8px}
#list li[hidden]{display:none}
.card{display:flex;gap:14px;padding:10px;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;
  box-shadow:5px 5px 0 var(--ink);color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s;flex:1}
a.card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
a.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.card img{width:104px;height:150px;flex:none;object-fit:cover;border-radius:12px;border:2px solid var(--ink);background:#f3e2a0}
.body{display:flex;flex-direction:column;min-width:0;flex:1}
.ep{align-self:flex-start;font-size:.75rem;font-weight:600;background:var(--blue);color:#fff;padding:1px 10px;border-radius:99px}
.title{font-size:1.15rem;font-weight:800;line-height:1.3;margin-top:4px}
.hook{font-size:.9rem;color:var(--muted)}
.cta{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:12px;
  background:var(--shopee);color:#fff;font-weight:600;font-size:.95rem}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.soon .cta{background:#ddd;color:var(--ink)}
.soon img{filter:grayscale(.6)}
.yt{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;background:var(--ink);color:#fff;
  font-weight:600;text-decoration:none}
.empty,.error{text-align:center;padding:24px 0;font-weight:600}
a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
footer{margin:32px auto 0;max-width:640px;font-size:.8rem;text-align:center}
footer p+p{margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<main>
  <header>
    <img class="avatar" src="avatar.webp" width="112" height="112" alt="โปรไฟล์ How It Works TH">

    <p class="tagline">ย่อตัวเข้าไปดูว่าของใช้ทำงานยังไง 🔬</p>
    <ul class="social" aria-label="ช่องทางติดตาม">
      <li><a href="https://www.youtube.com/@howitworksth" target="_blank" rel="noopener" aria-label="YouTube"><svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/></svg></a></li>
      <li><a href="https://www.tiktok.com/@howitworks_th" target="_blank" rel="noopener" aria-label="TikTok"><svg viewBox="0 0 24 24"><path d="M19.6 6.7a4.8 4.8 0 0 1-3.8-4.2V2h-3.4v13.7a2.9 2.9 0 1 1-2-2.7V9.5a6.3 6.3 0 1 0 5.4 6.2V8.8a8.2 8.2 0 0 0 4.8 1.5V6.9l-1-.2z"/></svg></a></li>
      <li><a href="https://www.instagram.com/howitworksth" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 3.9 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zM12 0C8.7 0 8.3 0 7.1.1 2.7.3.3 2.7.1 7.1 0 8.3 0 8.7 0 12s0 3.7.1 4.9c.2 4.4 2.6 6.8 7 7 1.2.1 1.6.1 4.9.1s3.7 0 4.9-.1c4.4-.2 6.8-2.6 7-7 .1-1.2.1-1.6.1-4.9s0-3.7-.1-4.9c-.2-4.4-2.6-6.8-7-7C15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 0 0 0-12.4zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.8a1.4 1.4 0 1 0 0 2.9 1.4 1.4 0 0 0 0-2.9z"/></svg></a></li>
      <!-- Facebook: add <li> here once the Page URL exists -->
    </ul>
  </header>

  <div class="search" role="search">
    <label class="sr-only" for="q">ค้นหาสินค้า</label>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ค้นหาสินค้า เช่น หม้อทอด, EP.2" autocomplete="off" enterkeyhint="search">
  </div>
  <p class="hint" id="hint">แตะการ์ดเพื่อดูสินค้าใน Shopee</p>

  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>ไม่พบสินค้าที่ค้นหา ลองคำอื่นดูนะ</p>
  <noscript><p class="error">กรุณาเปิด JavaScript เพื่อดูรายการสินค้า</p></noscript>

  <footer>
    <p>ลิงก์ในหน้านี้เป็นลิงก์ Affiliate เราอาจได้รับค่าคอมมิชชันเมื่อคุณซื้อสินค้า โดยไม่มีค่าใช้จ่ายเพิ่มสำหรับคุณ</p>
    <p>© How It Works TH</p>
  </footer>
</main>

<script>
const CART = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L21 7H6"/></svg>';
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
const norm = s => s.toLowerCase().replace(/[\s.]+/g, '');

function render(eps) {
  eps.sort((a, b) => b.ep - a.ep).forEach((e, i) => {
    const li = el('li');
    li.dataset.q = norm(`ep${e.ep} ${e.title} ${e.hook}`);
    const live = !!e.product_url;
    // whole card is the link: image + title are the tap target, URL used exactly as stored
    const card = el(live ? 'a' : 'div', 'card' + (live ? '' : ' soon'));
    if (live) { card.href = e.product_url; card.target = '_blank'; card.rel = 'sponsored noopener'; }

    const img = el('img');
    img.src = e.cover; img.alt = `ปก EP.${e.ep} ${e.title}`;
    img.width = 104; img.height = 150; img.decoding = 'async';
    if (i > 3) img.loading = 'lazy';

    const body = el('div', 'body');
    body.append(el('span', 'ep', `EP.${e.ep}`), el('span', 'title', e.title), el('span', 'hook', e.hook));
    const cta = el('span', 'cta');
    cta.innerHTML = live ? CART + 'ดูสินค้าใน Shopee' : 'เร็ว ๆ นี้';
    body.append(cta);
    card.append(img, body);
    li.append(card);

    if (e.youtube_url) {
      const yt = el('a', 'yt', '▶ ดูคลิป');
      yt.href = e.youtube_url; yt.target = '_blank'; yt.rel = 'noopener';
      li.append(yt);
    }
    $('list').append(li);
  });
}

$('q').addEventListener('input', () => {
  const q = norm($('q').value);
  let shown = 0;
  for (const li of $('list').children) shown += !(li.hidden = !li.dataset.q.includes(q));
  $('empty').hidden = shown > 0;
});

fetch('episodes.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => {
    $('hint').textContent = 'โหลดรายการสินค้าไม่สำเร็จ ลองรีเฟรชหน้านี้อีกครั้งนะ';
    $('hint').className = 'error';
  });
</script>
